name: Android APK build (debug)

# Блок A (Capacitor, Шаг 1): собирает debug APK нативной оболочки, чтобы
# тестировать реальный фон (background geolocation, Блок B) на телефоне
# без Android Studio на локальной машине. Debug APK не подписан релизным
# ключом — ставится на устройство напрямую (sideload, "Разрешить установку
# из неизвестных источников"), Google Play не нужен.
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install web deps
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor (copy dist into android project)
        run: npx cap sync android

      - name: Grant execute to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: poputchik-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Publish as GitHub Release asset (постоянная ссылка)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: Android debug APK (авто-сборка)
          body: >
            Автоматическая debug-сборка нативной оболочки (Capacitor) из
            main. Не подписана релизным ключом — только для тестирования на
            своём устройстве (sideload). Обновляется при каждом релевантном
            пуше в main.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
